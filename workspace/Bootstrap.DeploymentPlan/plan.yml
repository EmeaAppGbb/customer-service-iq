$schema: https://developer.microsoft.com/json-schemas/fabric/item/deploymentPlan/definition/plan/1.0.0/schema.json
version: 1.0.0
groups:
  - name: Scenario
    logicalId: ba9d0884-ce52-4c05-97d0-d3365078b2a3
  - name: SeedScenario
    logicalId: a9da0221-e1a7-4be0-89e3-2769c77cb28b
    dependsOn:
      - groupName: Scenario
    postActions:
      - name: Seed demo data
        job:
          type: Execute
          logicalId: a9da0221-e1a7-4be0-89e3-2769c77cb28b
          parameters:
            - name: lakehouse_name
              value: Scenario
            - name: allow_other_workspaces
              value: false
  - name: ScenarioOntology
    logicalId: 1f717f9e-f11e-48fe-bc82-76908da57f0e
    dependsOn:
      - groupName: SeedScenario
  - name: BindScenario
    logicalId: 09388d0e-8a96-46ce-b95e-bdac7186cc60
    dependsOn:
      - groupName: ScenarioOntology
    postActions:
      - name: Bind seeded ontology
        job:
          type: Execute
          logicalId: 09388d0e-8a96-46ce-b95e-bdac7186cc60
          parameters:
            - name: lakehouse_name
              value: Scenario
            - name: ontology_name
              value: ScenarioOntology
